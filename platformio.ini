; LilyGo T-QT Pro  --  ESP32-S3FN4R2 (4MB flash + 2MB PSRAM)
; 0.85" 128x128 panel, GC9A01 driver w/ CGRAM offset, HSPI @ 40MHz

[env:tqt-pro]
platform  = espressif32@^6.5.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu           = esp32s3
board_build.f_cpu         = 240000000L
board_build.flash_mode    = qio
; FN4R2 = quad flash + quad PSRAM. LilyGo's own board file says "No PSRAM"
; because it targets the 8MB variant; this is the correction. Nothing here
; keeps a framebuffer in PSRAM (see the extmem threshold note in main.cpp),
; but the TLS stack uses it, which leaves internal SRAM free.
board_build.arduino.memory_type = qio_qspi
board_build.partitions    = huge_app.csv
board_upload.flash_size   = 4MB
board_upload.maximum_size = 4194304

upload_protocol = esptool
upload_port     = COM3
monitor_port    = COM3
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; -Os is the platform default; the draw path wants -O3.
build_unflags = -Os
build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
